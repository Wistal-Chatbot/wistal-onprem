name: wistal

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No `ports:` on purpose — the database must not be reachable from the LAN.

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  # One-off migration runner: docker compose --profile tools run --rm migrate
  migrate:
    profiles: ["tools"]
    build:
      context: ./app
      dockerfile: Dockerfile
      target: builder
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "drizzle-kit", "migrate"]

  # Sync Comarch Optima -> public.* (repo Wistal-Chatbot/optima-neon-sync,
  # klon w /opt/wistal/sync). Pętla harmonogramu jest w kontenerze, więc nie ma
  # tu ani crona, ani systemd. Poświadczenia do Optimy i DATABASE_URL wskazujący
  # na `postgres:5432` idą z sync.env — port bazy pozostaje zamknięty dla LAN-u.
  # Schemat docelowy zakłada sql/001_public_schema.sql z tego samego repo.
  sync:
    build:
      context: ./sync
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: sync.env
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
