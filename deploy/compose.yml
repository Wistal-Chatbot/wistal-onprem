name: wistal

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No `ports:` on purpose — the database must not be reachable from the LAN.

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  # One-off migration runner: docker compose --profile tools run --rm migrate
  migrate:
    profiles: ["tools"]
    build:
      context: ./app
      dockerfile: Dockerfile
      target: builder
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "drizzle-kit", "migrate"]

  # Sync Comarch Optima -> public.* (repo Wistal-Chatbot/optima-neon-sync,
  # klon w /opt/wistal/sync). Pętla harmonogramu jest w kontenerze, więc nie ma
  # tu ani crona, ani systemd. Poświadczenia do Optimy idą z sync.env, a
  # DATABASE_URL składa compose z tych samych zmiennych co usługa postgres —
  # hasło bazy istnieje w jednym miejscu, w /opt/wistal/.env.
  # Schemat docelowy zakłada sql/001_public_schema.sql z tego samego repo.
  sync:
    # Profil "cron", nie usługa ciągła — jeden pełny cykl na dobę odpala
    # harmonogram systemowy (/etc/cron.d/wistal-sync), a nie pętla w programie.
    # Dzięki profilowi `docker compose up -d` NIE wystartuje synchronizacji;
    # pętla co kwadrans obciążała Optimę na tyle, że zauważalnie zwolniła.
    profiles: ["cron"]
    build:
      context: ./sync
      dockerfile: Dockerfile
    env_file: sync.env
    environment:
      # Składane z tych samych zmiennych co usługa postgres (compose czyta .env
      # z tego katalogu), żeby hasło bazy nie musiało być przepisywane do
      # sync.env i nie mogło się rozjechać po rotacji. Host to nazwa usługi —
      # połączenie idzie siecią compose, port 5432 pozostaje zamknięty dla LAN.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
